version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scopepilot-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_long_random_secret_in_production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - AI_PROVIDER=${AI_PROVIDER:-google}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - backend_uploads:/app/uploads
      - backend_sow_outputs:/app/sow_outputs
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scopepilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_sow_outputs:
